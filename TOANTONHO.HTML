<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sorting Adventure - Early Learning</title>
    <style>
        :root {
            --bg-color: #f0f9ff;
            --primary-btn: #4caf50;
            --secondary-btn: #2196f3;
            --panel-bg: rgba(255, 255, 255, 0.9);
        }

        * { box-sizing: border-box; touch-action: none; -webkit-user-select: none; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: var(--bg-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        /* --- UI Elements --- */
        #ui-layer {
            width: 100%;
            padding: 15px;
            text-align: center;
            z-index: 10;
        }

        #progress-container {
            width: 80%;
            height: 20px;
            background: #ddd;
            border-radius: 10px;
            margin: 10px auto;
            overflow: hidden;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: #ffeb3b;
            transition: width 0.3s ease;
        }

        h2 { margin: 5px; color: #333; font-size: 1.5rem; }

        /* --- Game Area --- */
        #game-canvas {
            flex-grow: 1;
            width: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
        }

        .drop-zones-container {
            display: flex;
            justify-content: space-around;
            width: 100%;
            padding: 20px;
        }

        .drop-zone {
            width: 160px;
            height: 180px;
            border: 4px dashed #999;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--panel-bg);
            position: relative;
            transition: transform 0.2s;
        }

        /* Container Visuals */
        .house { border-style: solid; border-bottom: 8px solid #5d4037; border-top-left-radius: 80px; border-top-right-radius: 80px; }
        .box { border-style: solid; border-radius: 10px; }
        .red-box { background: #ffebee; border-color: #f44336; color: #f44336; }
        .blue-box { background: #e3f2fd; border-color: #2196f3; color: #2196f3; }
        .cupboard { background: #efebe9; border: 6px solid #8d6e63; border-radius: 5px; }
        .toy-box { background: #f3e5f5; border: 6px solid #9c27b0; border-radius: 50% 50% 20% 20%; }

        .zone-label { font-weight: bold; margin-top: 10px; pointer-events: none; text-align: center;}

        /* --- Inventory --- */
        #inventory {
            width: 100%;
            height: 120px;
            background: rgba(0,0,0,0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding-bottom: 20px;
        }

        .draggable {
            font-size: 50px;
            cursor: grab;
            user-select: none;
            position: relative;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }

        .small-item { transform: scale(0.6); }
        .big-item { transform: scale(1.3); }

        /* --- Modal --- */
        #modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 10px 0 #ddd;
        }

        button {
            background: var(--primary-btn);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #2e7d32;
            margin-top: 20px;
        }

        button:active { transform: translateY(3px); box-shadow: 0 3px 0 #2e7d32; }

        /* Shake Animation */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }
        .shake { animation: shake 0.4s ease-in-out; }

        .confetti {
            position: absolute;
            width: 10px; height: 10px;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="ui-layer">
    <h2 id="level-title">Level 1: Big vs Small</h2>
    <div id="progress-container"><div id="progress-bar"></div></div>
</div>

<div id="game-canvas">
    <div class="drop-zones-container" id="zones-area">
        </div>
</div>

<div id="inventory" id="items-area">
    </div>

<div id="modal">
    <div class="modal-content">
        <h1 id="modal-text">🌟 Well Done! 🌟</h1>
        <button onclick="nextLevel()">Next Level</button>
    </div>
</div>

<script>
    // --- Game State & Data ---
    let currentLevel = 0;
    let itemsPlaced = 0;
    let totalItemsInLevel = 0;

    const levels = [
        {
            title: "Sort by Size: Nhà To & Nhà Nhỏ",
            zones: [
                { id: "small", label: "Nhà Nhỏ", class: "house", sizeReq: "small" },
                { id: "big", label: "Nhà To", class: "house", sizeReq: "big" }
            ],
            items: [
                { icon: "🍵", target: "small", size: "small" },
                { icon: "🥣", target: "small", size: "small" },
                { icon: "🥄", target: "small", size: "small" },
                { icon: "📺", target: "big", size: "big" },
                { icon: "🪑", target: "big", size: "big" },
                { icon: "🛋️", target: "big", size: "big" }
            ]
        },
        {
            title: "Sort by Color: Red vs Blue",
            zones: [
                { id: "red", label: "Red Box", class: "box red-box", colorReq: "red" },
                { id: "blue", label: "Blue Box", class: "box blue-box", colorReq: "blue" }
            ],
            items: [
                { icon: "🍎", target: "red" },
                { icon: "🎀", target: "red" },
                { icon: "🚙", target: "blue" },
                { icon: "📘", target: "blue" }
            ]
        },
        {
            title: "Advanced Logic: Size + Color",
            zones: [
                { id: "smallRed", label: "Small Red", class: "box red-box", style: "width:100px; height:100px" },
                { id: "bigBlue", label: "Big Blue", class: "box blue-box", style: "width:180px; height:180px" }
            ],
            items: [
                { icon: "📍", target: "smallRed", size: "small" },
                { icon: "🍒", target: "smallRed", size: "small" },
                { icon: "🐳", target: "bigBlue", size: "big" },
                { icon: "🧥", target: "bigBlue", size: "big" }
            ]
        },
        {
            title: "Family Slippers Match",
            zones: [
                { id: "baby", label: "Baby 👶", class: "box" },
                { id: "parents", label: "Parents 👨‍👩‍👧", class: "box" }
            ],
            items: [
                { icon: "🩴", target: "baby", size: "small" },
                { icon: "🩴", target: "baby", size: "small" },
                { icon: "🩴", target: "parents", size: "big" },
                { icon: "🩴", target: "parents", size: "big" }
            ]
        },
        {
            title: "Kitchen Cleanup",
            zones: [
                { id: "kitchen", label: "Kitchen Cupboard", class: "cupboard" },
                { id: "toys", label: "Toy Box", class: "toy-box" }
            ],
            items: [
                { icon: "🍲", target: "kitchen" },
                { icon: "🍳", target: "kitchen" },
                { icon: "🧸", target: "toys" },
                { icon: "🤖", target: "toys" }
            ]
        }
    ];

    // --- Audio Engine ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, type, duration) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    const soundSuccess = () => { playTone(523.25, 'sine', 0.2); setTimeout(() => playTone(659.25, 'sine', 0.3), 100); };
    const soundError = () => { playTone(150, 'sawtooth', 0.4); };

    // --- Core Game Logic ---
    function initLevel() {
        const level = levels[currentLevel];
        document.getElementById('level-title').innerText = level.title;
        document.getElementById('progress-bar').style.width = `${(currentLevel / levels.length) * 100}%`;
        
        const zonesArea = document.getElementById('zones-area');
        const inventory = document.getElementById('inventory');
        zonesArea.innerHTML = '';
        inventory.innerHTML = '';
        itemsPlaced = 0;
        totalItemsInLevel = level.items.length;

        // Create Zones
        level.zones.forEach(z => {
            const div = document.createElement('div');
            div.className = `drop-zone ${z.class}`;
            if(z.style) div.style = z.style;
            div.id = z.id;
            div.innerHTML = `<div class="zone-label">${z.label}</div>`;
            zonesArea.appendChild(div);
        });

        // Create Items
        level.items.forEach((item, index) => {
            const el = document.createElement('div');
            el.className = `draggable ${item.size === 'small' ? 'small-item' : item.size === 'big' ? 'big-item' : ''}`;
            el.innerHTML = item.icon;
            el.dataset.target = item.target;
            el.id = `item-${index}`;
            
            // Interaction logic
            setupDraggable(el);
            inventory.appendChild(el);
        });
    }

    function setupDraggable(el) {
        let offsetX, offsetY, startX, startY;
        let isDragging = false;

        const onStart = (e) => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            isDragging = true;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const rect = el.getBoundingClientRect();
            startX = rect.left;
            startY = rect.top;
            offsetX = clientX - rect.left;
            offsetY = clientY - rect.top;
            
            el.style.position = 'fixed';
            el.style.zIndex = 1000;
            moveAt(clientX, clientY);
        };

        const onMove = (e) => {
            if (!isDragging) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            moveAt(clientX, clientY);
        };

        const onEnd = (e) => {
            if (!isDragging) return;
            isDragging = false;
            
            const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
            const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
            
            el.style.visibility = 'hidden';
            const dropTarget = document.elementFromPoint(clientX, clientY)?.closest('.drop-zone');
            el.style.visibility = 'visible';

            if (dropTarget && dropTarget.id === el.dataset.target) {
                // Correct Drop
                dropTarget.appendChild(el);
                el.style.position = 'static';
                el.style.pointerEvents = 'none';
                itemsPlaced++;
                soundSuccess();
                createConfetti(clientX, clientY);
                checkWin();
            } else {
                // Wrong Drop
                soundError();
                el.classList.add('shake');
                setTimeout(() => {
                    el.classList.remove('shake');
                    el.style.position = 'relative';
                    el.style.left = '0';
                    el.style.top = '0';
                    document.getElementById('inventory').appendChild(el);
                }, 400);
            }
        };

        const moveAt = (x, y) => {
            el.style.left = x - offsetX + 'px';
            el.style.top = y - offsetY + 'px';
        };

        el.addEventListener('mousedown', onStart);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);

        el.addEventListener('touchstart', onStart, {passive: false});
        window.addEventListener('touchmove', onMove, {passive: false});
        window.addEventListener('touchend', onEnd, {passive: false});
    }

    function checkWin() {
        if (itemsPlaced === totalItemsInLevel) {
            setTimeout(() => {
                document.getElementById('modal').style.display = 'flex';
                if(currentLevel === levels.length - 1) {
                    document.getElementById('modal-text').innerText = "🏆 Grand Champion! 🏆";
                    document.querySelector('button').innerText = "Play Again";
                }
            }, 500);
        }
    }

    function nextLevel() {
        document.getElementById('modal').style.display = 'none';
        if (currentLevel < levels.length - 1) {
            currentLevel++;
        } else {
            currentLevel = 0;
        }
        initLevel();
    }

    function createConfetti(x, y) {
        for (let i = 0; i < 15; i++) {
            const div = document.createElement('div');
            div.className = 'confetti';
            div.style.left = x + 'px';
            div.style.top = y + 'px';
            div.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
            document.body.appendChild(div);
            
            const angle = Math.random() * Math.PI * 2;
            const velocity = 5 + Math.random() * 10;
            let curX = x;
            let curY = y;
            let vX = Math.cos(angle) * velocity;
            let vY = Math.sin(angle) * velocity;

            const anim = () => {
                vY += 0.5; // gravity
                curX += vX;
                curY += vY;
                div.style.left = curX + 'px';
                div.style.top = curY + 'px';
                if (curY < window.innerHeight) requestAnimationFrame(anim);
                else div.remove();
            };
            requestAnimationFrame(anim);
        }
    }

    // Start Game
    initLevel();
</script>

</body>
</html>
