<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Đoàn Tàu Vui Nhộn - Bé Học Quy Luật</title>
    <style>
        :root {
            --bg-sky: #CCF2F4;
            --grass: #A4EB82;
            --train-red: #FF5F5F;
            --train-blue: #54A1FF;
            --train-orange: #FFA347;
            --train-yellow: #FFD93D;
            --train-green: #6BCB77;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-sky);
            user-select: none; -webkit-user-select: none;
        }

        /* Khung cảnh */
        #game-stage {
            width: 100vw; height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            position: relative;
        }

        #grass-field {
            position: absolute; bottom: 0; width: 100%; height: 35vh;
            background-color: var(--grass); z-index: 1;
        }

        /* Header & Thông báo */
        #ui-layer {
            z-index: 10; text-align: center; margin-top: 20px;
        }
        h1 { color: #2C5E1A; margin: 0; text-shadow: 2px 2px white; font-size: 28px; }
        #instruction {
            background: white; padding: 10px 20px; border-radius: 30px;
            font-size: 20px; font-weight: bold; color: #444;
            margin-top: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: inline-block;
        }

        /* Khu vực Đoàn tàu */
        #train-track {
            position: relative; height: 180px; width: 100%;
            margin-top: 80px; display: flex; align-items: flex-end;
            justify-content: center; z-index: 5;
            transition: transform 1.5s ease-in;
        }

        .wagon {
            margin: 0 5px; position: relative; transition: all 0.5s;
        }

        .wagon-empty {
            width: 100px; height: 80px; border: 4px dashed #666;
            border-radius: 10px; background: rgba(255,255,255,0.3);
            display: flex; align-items: center; justify-content: center;
            font-size: 40px; color: #666;
        }

        /* Khu vực lựa chọn */
        #options-area {
            position: absolute; bottom: 40px; width: 100%;
            display: flex; justify-content: center; gap: 30px;
            z-index: 10;
        }

        .option-item {
            cursor: pointer; transition: transform 0.2s;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.2));
        }
        .option-item:hover { transform: scale(1.1); }
        .option-item:active { transform: scale(0.9); }

        /* Animation đoàn tàu chạy */
        .train-moving { transform: translateX(120vw); }

        /* Hiệu ứng rung khi sai */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        .error-shake { animation: shake 0.4s ease-in-out; }

        /* Overlay thông báo thắng */
        #overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.7);
            display: none; flex-direction: column; align-items: center;
            justify-content: center; z-index: 100; color: white;
        }
        .btn-restart {
            padding: 15px 40px; font-size: 24px; border: none;
            border-radius: 50px; background: var(--train-yellow);
            color: #333; font-weight: bold; cursor: pointer;
            margin-top: 20px; box-shadow: 0 6px 0 #D4AC0D;
        }
    </style>
</head>
<body>

<div id="game-stage">
    <div id="ui-layer">
        <h1>🚂 ĐOÀN TÀU VUI NHỘN</h1>
        <div id="instruction">Bé chọn toa tàu nào tiếp theo?</div>
    </div>

    <div id="train-track">
        </div>

    <div id="options-area">
        </div>

    <div id="grass-field"></div>

    <div id="overlay">
        <h2 style="font-size: 50px;">Bé giỏi quá! 🌟</h2>
        <button class="btn-restart" onclick="resetGame()">CHƠI LẠI NHÉ</button>
    </div>
</div>
