<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bé Tinh Mắt: To Hơn Hay Nhỏ Hơn?</title>
    <style>
        :root {
            --bg-color: #F0F9FF;
            --primary-pink: #FF85A1;
            --primary-blue: #4EA8DE;
            --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: var(--bg-color);
            font-family: var(--font-main); touch-action: none;
        }

        #game-container {
            position: relative; width: 100vw; height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        /* Header & Thông báo */
        #header {
            margin-top: 20px; text-align: center; z-index: 10;
        }
        h1 { color: #FF6B6B; margin: 0; font-size: 24px; text-shadow: 2px 2px white; }
        #instruction { font-size: 20px; color: #444; font-weight: bold; margin-top: 5px; background: rgba(255,255,255,0.7); padding: 5px 15px; border-radius: 20px; }

        /* Vùng chơi game */
        #play-area { flex-grow: 1; width: 100%; position: relative; }

        /* Giỏ chứa (Màn 1) */
        .bin {
            position: absolute; bottom: 20px; width: 160px; height: 160px;
            border: 5px dashed #ccc; border-radius: 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
            background: rgba(255,255,255,0.5); transition: all 0.3s;
        }
        .bin-big { left: 50px; border-color: var(--primary-pink); }
        .bin-small { right: 50px; border-color: var(--primary-blue); }
        .bin-label { font-weight: bold; margin-bottom: 10px; pointer-events: none; }

        /* Vật thể kéo thả */
        .draggable {
            position: absolute; cursor: grab; touch-action: none;
            filter: drop-shadow(3px 3px 5px rgba(0,0,0,0.1));
            z-index: 5; transition: transform 0.1s;
        }
        .draggable:active { cursor: grabbing; transform: scale(1.1); }

        /* Màn 2 - Vòng tròn */
        .hoop {
            position: absolute; cursor: pointer; transition: all 0.3s;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.2));
        }

        /* Hiệu ứng rung khi sai */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }
        .shake { animation: shake 0.4s ease-in-out; }

        /* Pháo giấy */
        .confetti {
            position: absolute; width: 10px; height: 10px; z-index: 100;
            pointer-events: none; border-radius: 50%;
        }

        /* Nút bắt đầu/Chơi lại */
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); display: flex; justify-content: center;
            align-items: center; z-index: 1000;
        }
        .btn {
            padding: 20px 40px; font-size: 30px; border: none; border-radius: 50px;
            background: #FFD93D; color: #333; cursor: pointer; font-weight: bold;
            box-shadow: 0 5px 0 #D4AC0D; transition: transform 0.2s;
        }
        .btn:active { transform: translateY(5px); box-shadow: none; }

        .counter {
            position: absolute; top: 20px; right: 20px; font-size: 30px;
            background: white; border-radius: 50%; width: 60px; height: 60px;
            display: flex; align-items: center; justify-content: center;
            border: 4px solid #FFD93D; font-weight: bold;
        }
    </style>
</head>
