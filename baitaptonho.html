<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bé Tinh Mắt: To Hơn Hay Nhỏ Hơn?</title>
    <style>
        :root {
            --bg-color: #E0F7FA;
            --primary-pink: #FF80AB;
            --primary-blue: #82B1FF;
            --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: var(--bg-color);
            font-family: var(--font-main); touch-action: none; user-select: none;
        }

        #game-container {
            position: relative; width: 100vw; height: 100vh;
            display: flex; flex-direction: column; align-items: center;
        }

        /* Header */
        #header { margin-top: 15px; text-align: center; z-index: 10; pointer-events: none; }
        h1 { color: #009688; margin: 0; font-size: 26px; text-shadow: 2px 2px white; text-transform: uppercase; }
        #instruction { 
            font-size: 18px; color: #D84315; font-weight: bold; margin-top: 8px; 
            background: rgba(255,255,255,0.9); padding: 8px 20px; border-radius: 20px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: inline-block;
        }

        /* Vùng chơi game */
        #play-area { flex-grow: 1; width: 100%; position: relative; }

        /* MÀN 1: GIỎ CHỨA */
        .bin-container {
            position: absolute; bottom: 20px; width: 100%; 
            display: flex; justify-content: space-around; align-items: flex-end;
        }
        .bin {
            width: 140px; height: 140px;
            border: 4px dashed #ccc; border-radius: 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.6); transition: all 0.3s;
            position: relative;
        }
        .bin-big { border-color: var(--primary-pink); background: #FCE4EC; }
        .bin-small { border-color: var(--primary-blue); background: #E3F2FD; }
        .bin-label { 
            font-weight: bold; font-size: 20px; margin-top: 10px; 
            color: #555; pointer-events: none; 
            position: absolute; bottom: -30px; width: 100%; text-align: center;
        }
        .bin-icon { pointer-events: none; opacity: 0.5; }

        /* VẬT THỂ */
        .game-object {
            position: absolute; cursor: grab; touch-action: none;
            filter: drop-shadow(0 4px 5px rgba(0,0,0,0.2));
            transition: transform 0.1s; z-index: 100;
        }
        .game-object:active { cursor: grabbing; scale: 1.1; }

        /* Hiệu ứng */
        .shake { animation: shake 0.4s ease-in-out; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .pop-out { animation: popOut 0.5s ease-out forwards; }
        @keyframes popOut {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.5; }
            100% { transform: scale(0); opacity: 0; }
        }

        /* Overlay màn hình chờ/thắng */
        #overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.85);
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; z-index: 2000; text-align: center; color: white;
        }
        .btn {
            padding: 15px 40px; font-size: 24px; border: none; border-radius: 50px;
            background: #FFD600; color: #333; cursor: pointer; font-weight: bold;
            box-shadow: 0 6px 0 #F57F17; margin-top: 20px;
            transition: transform 0.1s;
        }
        .btn:active { transform: translateY(4px); box-shadow: none; }

        /* Nút home */
        .home-btn {
            position: absolute; top: 10px; left: 10px; z-index: 100;
            background: white; border-radius: 50%; padding: 5px;
            cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="home-btn" onclick="location.reload()">🏠</div>
    <div id="header">
        <h1>BÉ TINH MẮT</h1>
        <div id="instruction">Đang tải...</div>
    </div>

    <div id="play-area"></div>

    <div id="overlay">
        <h2 style="font-size: 40px; margin-bottom: 10px;">Bé Sẵn Sàng Chưa?</h2>
        <p style="font-size: 18px;">Phân biệt Đồ vật TO và Đồ vật NHỎ nhé!</p>
        <button class="btn" onclick="startGame(1)">BẮT ĐẦU CHƠI</button>
    </div>
</div>

<script>
    const playArea = document.getElementById('play-area');
    const instruction = document.getElementById('instruction');
    const overlay = document.getElementById('overlay');
    
    let currentLevel = 1;
    let score = 0;
    let targetScore = 0;
    let currentTask2 = null; // Nhiệm vụ màn 2

    // --- KHO HÌNH ẢNH (SVG CODE) ---
    const SVGs = {
        ball: (color) => `<svg viewBox="0 0 100 100" style="width:100%;height:100%"><circle cx="50" cy="50" r="45" fill="${color}" stroke="white" stroke-width="4"/><circle cx="35" cy="35" r="10" fill="white" opacity="0.4"/></svg>`,
        
        gift: (color) => `<svg viewBox="0 0 100 100" style="width:100%;height:100%"><rect x="15" y="30" width="70" height="60" fill="${color}" rx="5"/><rect x="42" y="30" width="16" height="60" fill="#FFEB3B"/><rect x="15" y="50" width="70" height="16" fill="#FFEB3B"/><path d="M30 30 Q50 5 70 30" fill="none" stroke="#FFEB3B" stroke-width="5"/></svg>`,
        
        star: (color) => `<svg viewBox="0 0 100 100" style="width:100%;height:100%"><polygon points="50,5 61,35 95,35 68,55 79,85 50,65 21,85 32,55 5,35 39,35" fill="${color}" stroke="white" stroke-width="3"/></svg>`,
        
        bear: (color) => `<svg viewBox="0 0 100 100" style="width:100%;height:100%"><circle cx="25" cy="25" r="15" fill="${color}"/><circle cx="75" cy="25" r="15" fill="${color}"/><circle cx="50" cy="55" r="40" fill="${color}" stroke="white" stroke-width="3"/><circle cx="40" cy="45" r="5" fill="black"/><circle cx="60" cy="45" r="5" fill="black"/><ellipse cx="50" cy="65" rx="15" ry="10" fill="white"/><circle cx="50" cy="60" r="4" fill="black"/></svg>`
    };

    const Colors = ['#FF5252', '#448AFF', '#66BB6A', '#FFCA28', '#AB47BC', '#FF7043'];

    // --- QUẢN LÝ GAME ---
    function startGame(level) {
        currentLevel = level;
        score = 0;
        overlay.style.display = 'none';
        playArea.innerHTML = '';

        if (level === 1) setupLevel1();
        else if (level === 2) setupLevel2();
        else showWinGame();
    }

    // --- LEVEL 1: KÉO THẢ TO/NHỎ ---
    function setupLevel1() {
        targetScore = 5;
        instruction.innerText = "Kéo vật TO vào Giỏ TO, vật NHỎ vào Giỏ NHỎ";

        // Tạo 2 giỏ
        const binContainer = document.createElement('div');
        binContainer.className = 'bin-container';
        binContainer.innerHTML = `
            <div class="bin bin-big" data-type="big">
                <div style="font-size:50px">🐘</div>
                <div class="bin-label">GIỎ TO</div>
            </div>
            <div class="bin bin-small" data-type="small">
                <div style="font-size:30px">🐜</div>
                <div class="bin-label">GIỎ NHỎ</div>
            </div>
        `;
        playArea.appendChild(binContainer);

        spawnItemLevel1();
    }

    function spawnItemLevel1() {
        if (score >= targetScore) {
            setTimeout(() => showLevelComplete(2), 500);
            return;
        }

        // Random loại vật thể, màu sắc, và kích thước
        const keys = Object.keys(SVGs);
        const type = keys[Math.floor(Math.random() * keys.length)];
        const color = Colors[Math.floor(Math.random() * Colors.length)];
        const isBig = Math.random() > 0.5;

        const size = isBig ? 120 : 60; // Kích thước pixel
        const itemType = isBig ? 'big' : 'small';

        const el = document.createElement('div');
        el.className = 'game-object';
        el.style.width = size + 'px';
        el.style.height = size + 'px';
        el.innerHTML = SVGs[type](color);
        el.dataset.size = itemType;

        // Vị trí xuất hiện ngẫu nhiên ở phần trên
        el.style.left = (Math.random() * 60 + 20) + '%'; 
        el.style.top = '100px';

        playArea.appendChild(el);
        makeDraggable(el);
    }

    // Logic Kéo Thả (Fix lỗi elementFromPoint)
    function makeDraggable(el) {
        let isDragging = false;
        let startX, startY, initialLeft, initialTop;

        const getCoords = (e) => e.touches ? {x: e.touches[0].clientX, y: e.touches[0].clientY} : {x: e.clientX, y: e.clientY};

        const start = (e) => {
            isDragging = true;
            el.style.transition = 'none';
            el.style.zIndex = 1000;
            const coords = getCoords(e);
            startX = coords.x; startY = coords.y;
            const rect = el.getBoundingClientRect();
            initialLeft = rect.left; initialTop = rect.top;
        };

        const move = (e) => {
            if (!isDragging) return;
            // e.preventDefault(); // Chặn cuộn trang
            const coords = getCoords(e);
            el.style.left = (initialLeft + coords.x - startX) + 'px';
            el.style.top = (initialTop + coords.y - startY) + 'px';
        };

        const end = (e) => {
            if (!isDragging) return;
            isDragging = false;
            el.style.transition = 'transform 0.2s';
            el.style.zIndex = 100;

            // MẸO: Ẩn vật thể đi để soi xuống dưới xem có trúng giỏ không
            el.hidden = true;
            let x = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
            let y = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
            let elemBelow = document.elementFromPoint(x, y);
            el.hidden = false;

            let droppedBin = elemBelow ? elemBelow.closest('.bin') : null;

            if (droppedBin && droppedBin.dataset.type === el.dataset.size) {
                // Đúng
                celebrate(x, y);
                el.classList.add('pop-out');
                score++;
                setTimeout(() => {
                    el.remove();
                    spawnItemLevel1();
                }, 500);
            } else {
                // Sai
                el.classList.add('shake');
                setTimeout(() => {
                    el.classList.remove('shake');
                    el.style.top = '100px'; // Reset vị trí
                    el.style.left = '45%';
                }, 400);
            }
        };

        el.addEventListener('mousedown', start);
        el.addEventListener('touchstart', start, {passive: false});
        window.addEventListener('mousemove', move);
        window.addEventListener('touchmove', move, {passive: false});
        window.addEventListener('mouseup', end);
        window.addEventListener('touchend', end);
    }

    // --- LEVEL 2: CHỌN VẬT ---
    function setupLevel2() {
        targetScore = 3;
        playArea.innerHTML = '';
        generateTaskLevel2();
    }

    function generateTaskLevel2() {
        if (score >= targetScore) {
            setTimeout(showWinGame, 500);
            return;
        }

        playArea.innerHTML = '';
        
        // Random câu hỏi: Tìm To nhất (big) hay Nhỏ nhất (small)
        const findBig = Math.random() > 0.5;
        currentTask2 = findBig ? 'big' : 'small';
        
        instruction.innerHTML = `Bé hãy tìm: <span style="color:${findBig?'#D32F2F':'#1976D2'}; font-size:22px">VẬT ${findBig ? 'TO NHẤT' : 'NHỎ NHẤT'}</span>`;

        // Tạo 3 vật thể với 3 kích thước: 60, 100, 140
        const sizes = [60, 100, 140];
        // Xáo trộn vị trí
        sizes.sort(() => Math.random() - 0.5);

        const container = document.createElement('div');
        container.style.display = 'flex';
        container.style.justifyContent = 'space-around';
        container.style.alignItems = 'center';
        container.style.height = '100%';
        container.style.padding = '0 20px';

        sizes.forEach(size => {
            const keys = Object.keys(SVGs);
            const type = keys[Math.floor(Math.random() * keys.length)];
            const color = Colors[Math.floor(Math.random() * Colors.length)];

            const div = document.createElement('div');
            div.innerHTML = SVGs[type](color);
            div.style.width = size + 'px';
            div.style.height = size + 'px';
            div.style.cursor = 'pointer';
            div.style.transition = 'transform 0.2s';
            
            // Xác định đúng sai
            let isCorrect = false;
            if (findBig && size === 140) isCorrect = true;
            if (!findBig && size === 60) isCorrect = true;

            div.onclick = (e) => {
                if (isCorrect) {
                    celebrate(e.clientX, e.clientY);
                    div.style.transform = "scale(1.5)";
                    score++;
                    setTimeout(generateTaskLevel2, 1000);
                } else {
                    div.classList.add('shake');
                    setTimeout(() => div.classList.remove('shake'), 400);
                }
            };
            container.appendChild(div);
        });

        playArea.appendChild(container);
    }

    // --- HỆ THỐNG PHẢN HỒI ---
    function celebrate(x, y) {
        // Tạo pháo hoa đơn giản
        for (let i = 0; i < 15; i++) {
            const p = document.createElement('div');
            p.style.position = 'absolute';
            p.style.left = x + 'px';
            p.style.top = y + 'px';
            p.style.width = '10px';
            p.style.height = '10px';
            p.style.backgroundColor = Colors[Math.floor(Math.random()*Colors.length)];
            p.style.borderRadius = '50%';
            p.style.pointerEvents = 'none';
            p.style.zIndex = 9999;
            document.body.appendChild(p);

            const angle = Math.random() * Math.PI * 2;
            const velocity = 50 + Math.random() * 100;
            
            p.animate([
                { transform: 'translate(0,0) scale(1)', opacity: 1 },
                { transform: `translate(${Math.cos(angle)*velocity}px, ${Math.sin(angle)*velocity}px) scale(0)`, opacity: 0 }
            ], {
                duration: 600,
                easing: 'ease-out'
            }).onfinish = () => p.remove();
        }
    }

    function showLevelComplete(nextLevel) {
        overlay.style.display = 'flex';
        overlay.innerHTML = `
            <h2 style="font-size:40px">HURA! 🎉</h2>
            <p>Bé làm giỏi quá!</p>
            <button class="btn" onclick="startGame(${nextLevel})">MÀN TIẾP THEO 👉</button>
        `;
    }

    function showWinGame() {
        overlay.style.display = 'flex';
        overlay.innerHTML = `
            <h2 style="font-size:40px; color:#FFD700">CHIẾN THẮNG! 🏆</h2>
            <p>Bé là nhà vô địch Tinh Mắt!</p>
            <button class="btn" onclick="startGame(1)">CHƠI LẠI TỪ ĐẦU</button>
        `;
    }

</script>
</body>
</html>
